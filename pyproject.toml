[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rftinterp"
version = "0.1.0"
description = "RFT interpretation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "pandas>=1.3", "matplotlib>=3.4"]

[project.scripts]
rftinterp = "rftinterp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
